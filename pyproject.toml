[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raglight"
version = "4.0.0"
description = "RAGLight is a lightweight and modular Python library for implementing Retrieval-Augmented Generation (RAG). It enhances the capabilities of Large Language Models (LLMs) by combining document retrieval with natural language inference."
authors = [
    {name = "Bessouat40",email = "roman.bessouat@orange.fr"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
agentic-mcp = [
    "mcp>=2.3.0,<3",
]
langfuse = [
    "langfuse>=4,<6",
]
openai = [
    "langchain-core>=1.2.5",
    "langchain-openai>=1.1.6",
    "typing-extensions>=4.15.0",
]
ollama = [
    "langchain-core>=1.2.5",
    "langchain-ollama>=1.0.1",
    "typing-extensions>=4.15.0",
]
mistral = [
    "langchain-core>=1.2.5",
    "langchain-mistralai>=1.1.1",
    "typing-extensions>=4.15.0",
]
gemini = [
    "langchain-core>=1.2.5",
    "langchain-google-genai>=4.1.3",
    "typing-extensions>=4.15.0",
]
bedrock = [
    "langchain-aws>=1.2.1",
    "langchain-core>=1.2.5",
    "typing-extensions>=4.15.0",
]
huggingface = [
    "sentence-transformers>=5.1.2",
    "typing-extensions>=4.15.0",
]
documents = [
    "langchain-core>=1.2.5",
    "langchain-text-splitters>=1.1.0",
    "pymupdf>=1.26.7",
]
chroma = [
    "chromadb>=0.5.23",
    "rank_bm25>=0.2.2",
    "typing-extensions>=4.15.0",
]
qdrant = [
    "qdrant-client>=1.17.0",
    "rank_bm25>=0.2.2",
    "typing-extensions>=4.15.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "build>=1.2.2",
    "mypy>=1.15.0",
    "ruff>=0.11.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Start with correctness rules and expand the set as the v4 codebase matures.
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
warn_unused_configs = true
